name: Build APK v2

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack v2 ZIP
        run: |
          rm -rf app settings.gradle.kts build.gradle.kts gradle.properties cloudflare_worker
          unzip -o MiTvStickLauncher_v2.zip

      - name: Deploy Cloudflare Worker
        working-directory: cloudflare_worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Не заданы секреты CLOUDFLARE_API_TOKEN и/или CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          npx --yes wrangler@3 deploy worker.js \
            --name delicate-hill-35ee \
            --compatibility-date 2024-11-01 \
            --keep-vars

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk MiTvStickLauncher-v2.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MiTvStickLauncher-v2-APK
          path: MiTvStickLauncher-v2.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0
          name: "Готовый APK v2.0"
          files: MiTvStickLauncher-v2.apk
